<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>404 | AI Farmer Assistant</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Poppins',sans-serif;
}

body{

height:100vh;

display:flex;

justify-content:center;

align-items:center;

background:linear-gradient(135deg,#11998e,#38ef7d);

overflow:hidden;

}

.error-box{

background:white;

padding:60px;

border-radius:20px;

text-align:center;

box-shadow:0 15px 40px rgba(0,0,0,.25);

max-width:650px;

width:90%;

animation:fade .8s ease;

}

.error-box h1{

font-size:130px;

font-weight:700;

color:#198754;

}

.error-box h2{

font-weight:600;

margin-bottom:15px;

}

.error-box p{

color:#666;

font-size:18px;

margin-bottom:30px;

}

.btn-home{

padding:12px 40px;

border-radius:40px;

font-size:18px;

}

.icon{

font-size:80px;

color:#198754;

margin-bottom:20px;

}

@keyframes fade{

from{

opacity:0;

transform:translateY(50px);

}

to{

opacity:1;

transform:translateY(0);

}

}

</style>

</head>

<body>

<div class="error-box">

<div class="icon">

<i class="fa-solid fa-triangle-exclamation"></i>

</div>

<h1>404</h1>

<h2>Oops! Page Not Found</h2>

<p>

The page you are looking for doesn't exist or has been moved.

Please return to the AI Farmer Assistant home page.

</p>

<a href="/" class="btn btn-success btn-home">

<i class="fa-solid fa-house"></i>

 Back To Home

</a>

</div>

</body>

</html>
